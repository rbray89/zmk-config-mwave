include:
  - board: mwave_33
    snippet: studio-rpc-usb-uart
    artifact-name: ansi-windows
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
  - board: mwave_33
    artifact-name: ansi-windows-kvm
    cmake-args: -DCONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y -DCONFIG_ZMK_STUDIO=n -DCONFIG_ZMK_HID_REPORT_TYPE_HKRO=y -DCONFIG_ZMK_POINTING=n -DCONFIG_ZMK_USB_BOOT=y
  - board: mwave_33
    artifact-name: ansi-windows-secure-kvm
    cmake-args: -DCONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y -DCONFIG_ZMK_STUDIO=n -DCONFIG_ZMK_HID_REPORT_TYPE_HKRO=y -DCONFIG_ZMK_POINTING=n -DCONFIG_ZMK_USB_BOOT=y -DCONFIG_ZMK_HID_KEYBOARD_REPORT_SIZE=6 -DCONFIG_ZMK_BLE=n -DCONFIG_BT=n
  - board: mwave_33
    snippet: studio-rpc-usb-uart
    artifact-name: ansi-mac
    cmake-args: -DKEYMAP_FILE=/tmp/zmk-config/config/mwave_33_mac.keymap -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
  - board: mwave_33
    snippet: studio-rpc-usb-uart
    artifact-name: iso-windows
    cmake-args: -DKEYMAP_FILE=/tmp/zmk-config/config/mwave_33_iso.keymap -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
  - board: mwave_33
    snippet: studio-rpc-usb-uart zmk-usb-logging
    artifact-name: ansi-windows-logging
  - board: mwave_33
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_SETTINGS_RESET_ON_START=y -DCONFIG_ZMK_STUDIO=y
    artifact-name: ansi-settings-reset
